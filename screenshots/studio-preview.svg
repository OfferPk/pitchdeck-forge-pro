<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <style>
      .app-bg { fill: #070a13; }
      .hdr-bg { fill: #0f1626; stroke: #243452; stroke-width: 1; }
      .sidebar-bg { fill: #0f1626; stroke: #243452; stroke-width: 1; }
      .card-bg { fill: #182238; stroke: #243452; stroke-width: 1; rx: 8; }
      .input-bg { fill: #0b111e; stroke: #243452; stroke-width: 1; rx: 4; }
      .brand-title { font-family: sans-serif; font-size: 17px; font-weight: 800; fill: #f8fafc; }
      .sec-hdr { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
      .lbl-txt { font-family: sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .val-txt { font-family: sans-serif; font-size: 12px; fill: #f8fafc; }
      .btn-blue { fill: #38bdf8; rx: 6; }
      .btn-gray { fill: #182238; stroke: #243452; stroke-width: 1; rx: 6; }
      .btn-txt { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #070a13; text-anchor: middle; }
    </style>
  </defs>

  <rect class="app-bg" width="1200" height="750" />

  <!-- App Header -->
  <rect class="hdr-bg" x="0" y="0" width="1200" height="60" />
  <rect fill="#38bdf8" x="20" y="14" width="34" height="34" rx="8" />
  <text font-family="sans-serif" font-size="18" font-weight="900" fill="#070a13" x="28" y="37">🚀</text>
  <text class="brand-title" x="68" y="36">PitchDeck Forge Pro</text>
  <rect fill="rgba(56, 189, 248, 0.15)" x="245" y="20" width="55" height="20" rx="4" />
  <text font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" x="257" y="34">v1.0.0</text>

  <!-- Header Buttons -->
  <g transform="translate(680, 14)">
    <rect class="input-bg" x="0" y="0" width="190" height="32" />
    <text class="val-txt" x="12" y="21">B2B GenAI Agent ($2.5M)</text>
    <rect class="btn-gray" x="200" y="0" width="100" height="32" />
    <text font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" x="250" y="20" text-anchor="middle">Deck JSON</text>
    <rect class="btn-blue" x="310" y="0" width="180" height="32" />
    <text class="btn-txt" x="400" y="20">Print 1-Pager PDF</text>
  </g>

  <!-- Left Sidebar Controls -->
  <rect class="sidebar-bg" x="0" y="60" width="480" height="690" />
  <g transform="translate(20, 80)">
    <!-- Readiness Score Card -->
    <rect class="card-bg" x="0" y="0" width="440" height="85" />
    <text font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" x="15" y="25">INVESTOR READINESS SCORE</text>
    <text font-family="sans-serif" font-size="28" font-weight="900" fill="#10b981" x="15" y="58">100/100</text>
    <rect fill="rgba(16,185,129,0.15)" stroke="#059669" stroke-width="1" x="290" y="15" width="135" height="24" rx="4" />
    <text font-family="sans-serif" font-size="10.5" font-weight="800" fill="#10b981" x="357" y="31" text-anchor="middle">INVESTOR READY</text>
    <text font-family="sans-serif" font-size="10" fill="#cbd5e1" x="15" y="75">✓ All 6 core fundraising metrics verified.</text>

    <!-- Identity Box -->
    <rect class="card-bg" x="0" y="100" width="440" height="145" />
    <text class="sec-hdr" x="15" y="124">Company Identity &amp; Positioning</text>
    <text class="lbl-txt" x="15" y="146">Startup Name</text>
    <rect class="input-bg" x="15" y="152" width="410" height="26" />
    <text class="val-txt" x="25" y="169">OmniAgent AI</text>
    <text class="lbl-txt" x="15" y="192">1-Line Elevator Pitch</text>
    <rect class="input-bg" x="15" y="198" width="410" height="26" />
    <text class="val-txt" x="25" y="215">Autonomous Full-Stack Engineering Agents</text>

    <!-- Narrative Box -->
    <rect class="card-bg" x="0" y="260" width="440" height="180" />
    <text class="sec-hdr" x="15" y="284">Core Narrative &amp; Pain Point</text>
    <text class="lbl-txt" x="15" y="304">The Problem (Customer Pain)</text>
    <rect class="input-bg" x="15" y="310" width="410" height="45" />
    <text font-family="sans-serif" font-size="10" fill="#cbd5e1" x="25" y="328">Enterprises lose $120B in cloud downtime...</text>

    <text class="lbl-txt" x="15" y="370">The Solution (Breakthrough)</text>
    <rect class="input-bg" x="15" y="376" width="410" height="45" />
    <text font-family="sans-serif" font-size="10" fill="#cbd5e1" x="25" y="394">Autonomous deterministic AI agents that...</text>
  </g>

  <!-- Right Live Preview Workspace (Deck Mode) -->
  <g transform="translate(520, 80)">
    <!-- 16:9 Presentation Frame -->
    <rect fill="#0f1626" stroke="#243452" stroke-width="1.5" width="650" height="365" rx="12" />

    <!-- Slide Header -->
    <text font-family="sans-serif" font-size="10" font-weight="800" fill="#38bdf8" x="35" y="35">CAPITAL ALLOCATION &bull; THE FINANCIAL ASK</text>
    <text font-family="sans-serif" font-size="10" fill="#94a3b8" x="615" y="35" text-anchor="end">Slide 9 of 9</text>
    <line x1="35" y1="48" x2="615" y2="48" stroke="#243452" stroke-width="1" />

    <!-- Slide Main Content -->
    <g transform="translate(325, 140)">
      <text font-family="sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle">$2,500,000 Seed Round</text>
      <text font-family="sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle" y="35">Runway: 18 Months to $4.5M ARR / Cash-Flow Breakeven</text>
      
      <g transform="translate(-250, 60)">
        <rect fill="#182238" stroke="#243452" stroke-width="1" width="155" height="60" rx="6" />
        <text font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" x="77" y="24" text-anchor="middle">60% ENGINEERING</text>
        <text font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc" x="77" y="44" text-anchor="middle">$1,500,000</text>

        <rect fill="#182238" stroke="#243452" stroke-width="1" x="175" width="155" height="60" rx="6" />
        <text font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" x="252" y="24" text-anchor="middle">25% GTM &amp; SALES</text>
        <text font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc" x="252" y="44" text-anchor="middle">$625,000</text>

        <rect fill="#182238" stroke="#243452" stroke-width="1" x="350" width="155" height="60" rx="6" />
        <text font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" x="427" y="24" text-anchor="middle">15% OPERATIONS</text>
        <text font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc" x="427" y="44" text-anchor="middle">$375,000</text>
      </g>
    </g>

    <!-- Slide Footer -->
    <line x1="35" y1="330" x2="615" y2="330" stroke="#243452" stroke-width="1" />
    <text font-family="sans-serif" font-size="10" fill="#64748b" x="35" y="348">OmniAgent AI &bull; Confidential Investor Deck</text>
    <text font-family="sans-serif" font-size="10" fill="#64748b" x="615" y="348" text-anchor="end">Use Left / Right Arrows to Navigate</text>
  </g>
</svg>
